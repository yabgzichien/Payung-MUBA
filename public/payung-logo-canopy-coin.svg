<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p3h-title p3h-desc"
     viewBox="0 0 260 72" width="260" height="72">
  <title id="p3h-title">Payung</title>
  <desc id="p3h-desc">Payung logo — a premium umbrella canopy with coin accent and elegant wordmark</desc>
  <defs>
    <style>
      .bg3   { fill: #13110e; }
      .wm3   { fill: #f5e6c0; font-family: 'Georgia', 'Palatino Linotype', serif;
                font-weight: 700; font-size: 24px; letter-spacing: 0.5px; }
      .sub3  { fill: #6b5535; font-family: 'Georgia', 'Palatino Linotype', serif;
                font-style: italic; font-size: 9px; letter-spacing: 1.2px; }
      .div3  { stroke: #2e2820; stroke-width: 1; }
    </style>
    <linearGradient id="cg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f5e199"/>
      <stop offset="100%" stop-color="#c87b1a"/>
    </linearGradient>
    <linearGradient id="ig3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fff9e6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c87b1a"  stop-opacity="0"/>
    </linearGradient>
    <filter id="glow3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="260" height="72" rx="12" class="bg3"/>
  <rect width="260" height="72" rx="12" fill="none" stroke="#2e2820" stroke-width="1"/>
  <g filter="url(#glow3)">
    <path fill="url(#cg3)" stroke="#f5e199" stroke-width="1"
          d="M 8 42 Q 38 12 68 42 Z"/>
    <path fill="url(#ig3)" d="M 8 42 Q 38 12 68 42 Z"/>
    <line x1="38" y1="14" x2="8"  y2="42" stroke="#13110e" stroke-width="0.8" opacity="0.55"/>
    <line x1="38" y1="14" x2="23" y2="36" stroke="#13110e" stroke-width="0.8" opacity="0.55"/>
    <line x1="38" y1="14" x2="38" y2="42" stroke="#13110e" stroke-width="0.8" opacity="0.55"/>
    <line x1="38" y1="14" x2="53" y2="36" stroke="#13110e" stroke-width="0.8" opacity="0.55"/>
    <line x1="38" y1="14" x2="68" y2="42" stroke="#13110e" stroke-width="0.8" opacity="0.55"/>
    <path fill="none" stroke="#f5e199" stroke-width="1.4" stroke-linecap="round"
          d="M 8 42 Q 18 49 28 42 Q 38 49 48 42 Q 58 49 68 42"/>
    <circle cx="38" cy="14" r="2" fill="#fff9e6" opacity="0.95"/>
    <polygon points="38,39 41.5,41 41.5,45 38,47 34.5,45 34.5,41"
             fill="#13110e" stroke="#f5e199" stroke-width="1"/>
    <polygon points="38,40.5 40,43 38,45.5 36,43" fill="#f5e199" opacity="0.8"/>
  </g>
  <line x1="38" y1="47" x2="38" y2="58" stroke="#c87b1a" stroke-width="2" stroke-linecap="round"/>
  <path fill="none" stroke="#c87b1a" stroke-width="2" stroke-linecap="round"
        d="M 38 58 Q 38 64 33 64 Q 29 64 29 59.5"/>
  <line class="div3" x1="82" y1="16" x2="82" y2="58"/>
  <text class="wm3" x="94" y="40">Payung</text>
  <text class="sub3" x="96" y="56">on-chain downside protection</text>
</svg>
