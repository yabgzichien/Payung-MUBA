<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <!-- Background gradient: deep charcoal -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1712"/>
      <stop offset="100%" stop-color="#0e0d0a"/>
    </linearGradient>

    <!-- Umbrella canopy gradient: amber gold -->
    <linearGradient id="canopyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd882"/>
      <stop offset="100%" stop-color="#e8a020"/>
    </linearGradient>

    <!-- Inner canopy highlight -->
    <linearGradient id="innerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e8a020" stop-opacity="0"/>
    </linearGradient>

    <!-- Rain drop gradient -->
    <linearGradient id="rainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ecbff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a9bdc" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow filter for umbrella -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle text glow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" in="SourceGraphic" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip rain below canopy -->
    <clipPath id="rainClip">
      <rect x="0" y="46" width="80" height="34"/>
    </clipPath>
  </defs>

  <!-- Background pill -->
  <rect width="320" height="80" rx="14" fill="url(#bgGrad)"/>
  <rect width="320" height="80" rx="14" fill="none" stroke="#3d3424" stroke-width="1"/>

  <!-- Rain streaks (behind umbrella) -->
  <g clip-path="url(#rainClip)" opacity="0.55">
    <line x1="14" y1="48" x2="11" y2="62" stroke="url(#rainGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="21" y1="50" x2="18" y2="67" stroke="url(#rainGrad)" stroke-width="1"   stroke-linecap="round"/>
    <line x1="28" y1="47" x2="25" y2="63" stroke="url(#rainGrad)" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="35" y1="51" x2="32" y2="68" stroke="url(#rainGrad)" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="42" y1="48" x2="39" y2="65" stroke="url(#rainGrad)" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="49" y1="50" x2="46" y2="66" stroke="url(#rainGrad)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="56" y1="47" x2="53" y2="64" stroke="url(#rainGrad)" stroke-width="1"   stroke-linecap="round"/>
    <line x1="63" y1="49" x2="60" y2="67" stroke="url(#rainGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="70" y1="48" x2="67" y2="63" stroke="url(#rainGrad)" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- UMBRELLA MARK -->
  <g filter="url(#glow)">
    <!-- Glow halo -->
    <path d="M 8 38 Q 40 10 72 38" fill="none" stroke="#e8a020" stroke-width="9" stroke-linecap="round" opacity="0.15"/>
    <!-- Canopy fill -->
    <path d="M 8 38 Q 40 10 72 38 Z" fill="url(#canopyGrad)" stroke="#fcd882" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Inner highlight wash -->
    <path d="M 8 38 Q 40 10 72 38 Z" fill="url(#innerGrad)"/>
    <!-- Rib lines from apex -->
    <line x1="40" y1="14" x2="8"  y2="38" stroke="#1a1712" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
    <line x1="40" y1="14" x2="24" y2="33" stroke="#1a1712" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
    <line x1="40" y1="14" x2="40" y2="38" stroke="#1a1712" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
    <line x1="40" y1="14" x2="56" y2="33" stroke="#1a1712" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
    <line x1="40" y1="14" x2="72" y2="38" stroke="#1a1712" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
    <!-- Inner arc ring -->
    <path d="M 16 38 Q 40 20 64 38" fill="none" stroke="#fff" stroke-width="0.6" opacity="0.12" stroke-linecap="round"/>
  </g>

  <!-- Scalloped hem -->
  <path d="M 8 38 Q 17 44 26 38 Q 35 44 44 38 Q 53 44 62 38 Q 67 44 72 38"
        fill="none" stroke="#fcd882" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Handle shaft -->
  <line x1="40" y1="38" x2="40" y2="58" stroke="#e8a020" stroke-width="2" stroke-linecap="round"/>
  <!-- Crook -->
  <path d="M 40 58 Q 40 65 34 65 Q 29 65 29 60" fill="none" stroke="#e8a020" stroke-width="2" stroke-linecap="round"/>

  <!-- Apex dot -->
  <circle cx="40" cy="14" r="2" fill="#ffe9a0" opacity="0.9"/>

  <!-- WORDMARK -->
  <text
    x="95" y="37"
    font-family="'Georgia', 'Palatino', serif"
    font-size="26"
    font-weight="700"
    letter-spacing="1"
    fill="#fcd882"
    filter="url(#textGlow)"
  >Payung</text>

  <text
    x="96" y="55"
    font-family="'system-ui', '-apple-system', 'Helvetica Neue', sans-serif"
    font-size="10"
    font-weight="400"
    letter-spacing="2.5"
    fill="#a0855a"
  >PROTECT · BEFORE · IT · RAINS</text>

  <!-- Divider -->
  <line x1="84" y1="20" x2="84" y2="62" stroke="#3d3424" stroke-width="1"/>
</svg>
