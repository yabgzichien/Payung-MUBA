<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p2h-title p2h-desc"
     viewBox="0 0 240 64" width="240" height="64">
  <title id="p2h-title">Payung</title>
  <desc id="p2h-desc">Payung logo — a put-option payoff hook with falling rain drops</desc>
  <defs>
    <style>
      .bg2  { fill: #0d1117; }
      .hook { fill: none; stroke: #3b82f6; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .rain { fill: #60a5fa; opacity: 0.5; }
      .accent { fill: #fcd882; }
      .wm2  { fill: #f1f5f9; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
               font-weight: 700; font-size: 22px; letter-spacing: -0.5px; }
      .tag2 { fill: #4e6a8a; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
               font-weight: 400; font-size: 8.5px; letter-spacing: 2.8px; }
      .div2 { stroke: #1e2a38; stroke-width: 1; }
    </style>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="240" height="64" rx="12" class="bg2"/>
  <g class="rain">
    <ellipse cx="18" cy="14" rx="1.2" ry="2.2"/>
    <ellipse cx="27" cy="10" rx="1"   ry="1.8"/>
    <ellipse cx="36" cy="15" rx="1.3" ry="2.4"/>
    <ellipse cx="45" cy="9"  rx="1"   ry="1.8"/>
    <ellipse cx="54" cy="13" rx="1.2" ry="2.2"/>
  </g>
  <g filter="url(#glow2)">
    <path class="hook" d="M 10 48 L 36 48 L 36 22"/>
    <circle cx="36" cy="48" r="3" fill="#3b82f6"/>
    <circle class="accent" cx="36" cy="22" r="2.8"/>
  </g>
  <line class="div2" x1="76" y1="14" x2="76" y2="50"/>
  <text class="wm2" x="88" y="37">Payung</text>
  <text class="tag2" x="90" y="52">PROTECT · BEFORE · IT · RAINS</text>
</svg>
